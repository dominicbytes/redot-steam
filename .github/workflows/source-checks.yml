name: Public source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/generate_parity_inventory.py --check
      - run: python scripts/verify_port.py
      - run: python -m unittest discover -s tests/scripts -v
      - run: python tests/native/run_tests.py
      - run: python tests/native/test_lane_bounds.py
